---
# GNOME Shell extension management tasks.
# Included from *tasks/main.yml* with the tag "extensions".

# Directory where extensions are installed.  Users can override the
# default in their inventory as `gnome_extensions_dir` if desired.
- name: Set extensions directory fact
  ansible.builtin.set_fact:
    _extensions_dir: "{{ gnome_extensions_dir | default('/home/' + gnome_user + '/.local/share/gnome-shell/extensions') }}"

# -------------------------------------------------------------------
# Snapshot current enabled extensions so we can report changes later
# -------------------------------------------------------------------
- name: Gather current enabled extensions
  ansible.builtin.command: gnome-extensions list --enabled
  become_user: "{{ gnome_user }}"
  register: r_extensions_before
  changed_when: false

- name: Load GNOME Shell extension information
  ansible.builtin.include_tasks: get_extension_info.yml
  loop: "{{ gnome_extensions | default([]) }}"

# -------------------------------------------------------------------
# Install (and optionally enable) each extension.
# -------------------------------------------------------------------

- name: Install GNOME Shell extensions
  ansible.builtin.include_tasks: install_extension.yml
  loop: "{{ gnome_extensions_full | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
