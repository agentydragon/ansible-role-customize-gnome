---
# Determine if the URL points directly to a font file (.ttf /.otf) or
# an archive (zip/tar…).  Installation is handled in one step either
# way – we write directly to the system fonts directory and let Ansible
# report changes, which then trigger the “Refresh font cache” handler.

- ansible.builtin.set_fact:
    _is_font_file: "{{ gnome_font.url | regex_search('(.ttf|.otf)$') is not none }}"

# Archive case
- name: Download & extract {{ gnome_font.name }} archive
  ansible.builtin.unarchive:
    src: "{{ gnome_font.url }}"
    dest: /usr/local/share/fonts/
    remote_src: true
    mode: 0774
  when: not _is_font_file
  become: true
  notify: Refresh font cache

# Single-file case
- name: Download {{ gnome_font.name }} font file
  ansible.builtin.get_url:
    url: "{{ gnome_font.url }}"
    dest: "/usr/local/share/fonts/{{ gnome_font.fonts | default(gnome_font.url | basename) }}"
    mode: 0774
  when: _is_font_file
  become: true
  notify: Refresh font cache
